name: Release debug v0.1.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-debug.yml']
permissions:
  contents: read
concurrency:
  group: release-v0.1.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and build
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/QuitSmok-0.1.0-debug.apk
          cd dist
          sha256sum QuitSmok-0.1.0-debug.apk > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.1.0 dist/QuitSmok-0.1.0-debug.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "QuitSmok v0.1.0 · Java debug" \
            --notes-file docs/releases/v0.1.0.md --prerelease
